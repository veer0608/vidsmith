# The suite is fast and hermetic apart from ffmpeg: nothing here reaches a
# network, and the slow tests skip themselves when ffmpeg is missing rather than
# failing. So the runner installs ffmpeg and runs everything, including the
# encodes, because those are the tests that catch drift between picture and
# voice.
#
# Three platforms, because a whole class of fault is invisible to ubuntu on a
# project developed against Windows: path separators, the drive colon inside a
# filtergraph, and the console encoding. `vidsmith meta` once wrote every file
# correctly and then died printing a Pexels photographer's name, and nothing on
# Linux could ever have caught it.
#
# macOS is here because the README invites a mac user to clone this and nothing
# had ever run there. It has neither the Windows font families the themes name
# nor apt to install the fallback, which is the part most likely to be wrong.
#
# Both jobs run the encodes, and they are not redundant: the escaping tests take
# their paths from tmp_path, so only the Windows runner ever hands ffmpeg a
# drive letter - which is the thing that escaping exists for.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # fonts-dejavu-core because the themes name Windows families: without a
      # real face installed, Pillow falls back to its bitmap default and the
      # card and diagram tests measure text that no one would ship.
      - name: Install ffmpeg and a font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      # requirements-web too, or the 39 web tests skip themselves on a missing
      # fastapi and the run looks green while covering nothing
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r requirements-web.txt

      - name: Run the suite
        run: python -m pytest

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The encodes run here too, and it matters more than it looks. The slow
      # tests build their paths from tmp_path, which on Linux has no drive
      # letter - so `escape_filter_path`, whose entire subject is the drive
      # colon, has never met one under a real ffmpeg. This is the only runner
      # where that assertion means anything.
      #
      # It also keeps test_health_reports_ffmpeg honest: /healthz reports ok
      # false without a binary, and the test carries no marker and no skip, so
      # it fails rather than skips on a runner that has none. That is the test
      # being right about its environment and the job being wrong.
      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress -y

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r requirements-web.txt

      # Windows ships the families the themes name (Segoe UI Black, Bahnschrift),
      # so unlike the Linux job this one needs no font installed.
      - name: Run the suite
        run: python -m pytest

      # pytest is not enough on its own. Its capture is utf-8 on every platform,
      # so the console-encoding fault cannot reach it - only a real entry point
      # writing to a real pipe can. These need no key and touch no network.
      - name: Walk the CLI through a pipe
        run: |
          python -m vidsmith doctor
          python -m vidsmith new ci-probe
          python -m vidsmith build ci-probe --provider cards --stop-after parse

      # The regression itself, in the form it actually shipped: a stock credit
      # printed to a pipe after the files were already written. A module rather
      # than a one-liner so the name stays literal utf-8 source instead of
      # crossing two levels of shell quoting.
      - name: A name outside cp1252 must survive a piped console
        run: python -m scripts.console_probe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The README tells a mac user to brew this, so the job does what the
      # README says rather than relying on whatever the image happens to ship.
      - name: Install ffmpeg and a font
        run: |
          brew install ffmpeg
          brew install --cask font-dejavu

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r requirements-web.txt

      - name: Run the suite
        run: python -m pytest

      # The quickstart in the README, run as written. macOS is the platform this
      # project has never touched, and the install path it documents is the one
      # a stranger follows first.
      - name: Walk the CLI through a pipe
        run: |
          python -m vidsmith doctor
          python -m vidsmith new ci-probe
          python -m vidsmith build ci-probe --provider cards --stop-after parse
