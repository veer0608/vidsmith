# Measures the intermittent macOS narration hang instead of waiting for it.
#
# `test_each_scene_speaks_at_its_own_start` has hung on macOS at least seven
# times, always alone, always passing on a re-run. Against the runs either side
# that is about 4.4% of macOS runs. `apad=whole_dur` was added on the strength of
# one progress line and the code says so in as many words: a narrowing, not a
# proven fix. Forty-one green runs since still leave roughly a one-in-six chance
# of a streak that lucky, so main going green cannot settle it.
#
# Two arms, same graph, one variable. `bounded` is the code as it ships; `bare`
# restores the unbounded apad it replaced. If bare hangs and bounded does not,
# the fix is proven. If both hang, the pad was never the culprit and the next
# suspect is `amix ... dropout_transition=0`, which is what render.py already
# predicts. If neither hangs, the amplification is not reaching the real trigger
# and the loop needs rethinking rather than the code.
#
# Its first run, on 2026-09-12, measured the wrong ffmpeg. Every recorded hang
# ran on Homebrew ffmpeg 8.1.2; by then `brew install ffmpeg` on macos-26-arm64
# resolved to 9.0.1, because the runner image build had moved on. Zero hangs in
# 6000 calls on 9.0.1 says nothing about 8.1.2, so that run settles nothing and
# the ffmpeg formula is now an input, checked against what vidsmith resolves.
#
# Manual only. It is a diagnostic, not a gate, so it never runs on a push.
name: narration hang probe

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "build_narration calls per shard"
        default: "500"
      timeout:
        description: "seconds before a call counts as hung (healthy is ~0.1s)"
        default: "8"
      ffmpeg_formula:
        description: "Homebrew formula; ffmpeg@8 is 8.1.2, the version every recorded hang ran on"
        default: "ffmpeg@8"
      ffmpeg_expect:
        description: "version the job must actually resolve, or it refuses to run; empty skips the check"
        default: "8.1.2"

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arm: [bounded, bare]
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # A versioned formula is keg-only and never linked, so it goes on PATH for
      # the shell and into FFMPEG_BINARY / FFPROBE_BINARY for vidsmith, whose
      # resolver checks those first. Setting both means neither can quietly pick
      # up some other ffmpeg the image happens to carry.
      - name: Install ffmpeg
        env:
          FORMULA: ${{ github.event.inputs.ffmpeg_formula }}
        run: |
          brew install "$FORMULA"
          prefix="$(brew --prefix "$FORMULA")"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "FFMPEG_BINARY=$prefix/bin/ffmpeg" >> "$GITHUB_ENV"
          echo "FFPROBE_BINARY=$prefix/bin/ffprobe" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Asks vidsmith's own resolver, not the shell. The last two probes both
      # trusted `brew install ffmpeg` to mean the version in CLAUDE.md, and both
      # measured a different one. This refuses instead.
      - name: Refuse to measure the wrong ffmpeg
        env:
          EXPECT: ${{ github.event.inputs.ffmpeg_expect }}
        run: python scripts/which_ffmpeg.py

      # The arm is only real if the patch landed. A silent no-op here would
      # produce two identical arms and a confident wrong answer, which is the
      # failure this repo keeps writing down about installers that exit 0 having
      # done nothing.
      - name: Restore the unbounded pad
        if: matrix.arm == 'bare'
        run: |
          python - <<'PY'
          import pathlib, sys
          p = pathlib.Path("vidsmith/render.py")
          src = p.read_text(encoding="utf-8")
          old = '    pad = f"apad=whole_dur={total:.3f}"'
          new = '    pad = "apad"'
          if old not in src:
              sys.exit("patch target not found; render.py has moved on and this "
                       "workflow is measuring something it does not understand")
          p.write_text(src.replace(old, new, 1), encoding="utf-8")
          print("patched to bare apad")
          PY
          grep -n 'pad = ' vidsmith/render.py | head -1

      - name: Confirm which pad this job will actually run
        run: |
          python -c "import inspect,sys; sys.path.insert(0,'.'); from vidsmith import render; print([l.strip() for l in inspect.getsource(render.build_narration).splitlines() if 'pad =' in l][0])"

      - name: Probe
        env:
          PROBE_ARM: ${{ matrix.arm }}
          PROBE_SHARD: ${{ matrix.shard }}
        run: |
          echo "| arm | shard | iterations | hangs | rate | errors |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- | --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          python scripts/hang_probe.py \
            --iterations ${{ github.event.inputs.iterations }} \
            --timeout ${{ github.event.inputs.timeout }}
