<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vidsmith · Access requests</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #000; --surface: #0a0a0a; --border: #262626;
    --fg: #ededed; --fg-2: #a1a1a1;
    --ok: #3fcf8e; --warn: #f5a524; --bad: #ff6369; --focus: #60a5fa;
    --brand-a: #a78bfa;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root { color-scheme: light; --bg: #fff; --surface: #fafafa; --border: #e5e5e5;
            --fg: #171717; --fg-2: #525252; --ok: #067a46; --warn: #8a5a00;
            --bad: #c4161c; --focus: #1d4ed8; --brand-a: #6d28d9; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--sans);
         padding: 24px 16px; }
  main { max-width: 44rem; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  p.sub { color: var(--fg-2); margin: 0 0 20px; }
  .row { background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
         padding: 14px 16px; margin-bottom: 10px; display: flex; gap: 12px;
         align-items: center; flex-wrap: wrap; }
  /* the status sits under the name, so the buttons are the only thing on the
     right and stay together; on a narrow screen they drop below as one group */
  .who { flex: 1 1 14rem; min-width: 0; overflow-wrap: anywhere; }
  .who small { display: block; color: var(--fg-2); }
  .tag { display: block; font-size: 13px; margin-top: 4px; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .pending { color: var(--warn); } .approved { color: var(--ok); } .denied { color: var(--bad); }
  button { background: transparent; color: var(--fg); border: 1px solid var(--border);
           border-radius: 6px; padding: 7px 12px; font: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button.go { border-color: var(--ok); color: var(--ok); }
  button.no { border-color: var(--bad); color: var(--bad); }
  .msg { color: var(--bad); min-height: 1.4em; }
  a { color: var(--brand-a); }
  #link[hidden] { display: none !important; }
  #link code { display: block; margin: 8px 0; word-break: break-all;
               font-family: ui-monospace, Menlo, Consolas, monospace; }
</style>
</head>
<body>
<main>
  <h1>Access requests</h1>
  <p class="sub" id="sub">Uses the owner token saved in this browser.</p>
  <p class="msg" id="msg" role="alert" aria-live="polite"></p>
  <div class="row" id="link" hidden style="display:block"></div>
  <div id="list"></div>
  <p><a href="/">Back to vidsmith</a></p>
</main>
<script>
const $ = (id) => document.getElementById(id);
const token = () => { try { return localStorage.getItem("vidsmith_token") || ""; } catch { return ""; } };
const headers = () => ({"X-Vidsmith-Token": token()});

async function load() {
  $("msg").textContent = "";
  let r;
  try { r = await fetch("/api/admin/requests", {headers: headers()}); }
  catch { $("msg").textContent = "Could not reach the server."; return; }
  if (r.status === 401) {
    $("msg").textContent = "This needs the owner token. Open vidsmith with your login link, then come back.";
    return;
  }
  const body = await r.json();
  $("sub").textContent = "Each approved person can render " + body.daily_renders +
    " videos and draft " + body.daily_drafts + " scripts a day. " +
    (body.email_alerts ? "New requests are emailed to you."
                       : "Email alerts are off: set VIDSMITH_ALERT_TO and the SMTP settings in the box's .env.");
  const list = $("list");
  list.replaceChildren();
  if (!body.requests.length) {
    const p = document.createElement("p");
    p.className = "sub"; p.textContent = "No requests yet.";
    list.append(p);
  }
  for (const q of body.requests) {
    const row = document.createElement("div"); row.className = "row";
    const who = document.createElement("div"); who.className = "who";
    who.textContent = q.name;
    for (const text of [q.email, q.note].filter(Boolean)) {
      const s = document.createElement("small"); s.textContent = text; who.append(s);
    }
    const tag = document.createElement("span");
    tag.className = "tag " + q.status;
    tag.textContent = q.status === "approved"
      ? "approved · " + q.today + " renders, " + q.drafts + " drafts today" : q.status;
    who.append(tag);
    const acts = document.createElement("div"); acts.className = "acts";
    if (q.status !== "approved") acts.append(button("Approve", "go", q.id, "approve"));
    if (q.status === "approved") acts.append(button("New Login Link", "", q.id, "reissue"));
    if (q.status !== "denied") acts.append(button(q.status === "approved" ? "Revoke" : "Deny", "no", q.id, "deny"));
    if (q.status === "denied") acts.append(button("Remove", "", q.id, "remove"));
    row.append(who, acts);
    list.append(row);
  }
}

/* A reissued token is shown here once, as a login link, for the owner to send
   on. It is not kept anywhere this page can show it again. */
function showLink(token) {
  const url = new URL("/", window.location.href);
  url.searchParams.set("t", token);
  const box = $("link");
  box.replaceChildren();
  const p = document.createElement("p");
  p.textContent = "New login link. Send it to them; it will not be shown again, " +
                  "and their old one has stopped working:";
  const code = document.createElement("code"); code.textContent = url.toString();
  const copy = document.createElement("button");
  copy.type = "button"; copy.textContent = "Copy";
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(url.toString()); copy.textContent = "Copied"; }
    catch { copy.textContent = "Select the link and copy it"; }
  });
  box.append(p, code, copy);
  box.hidden = false;
}

function button(label, cls, id, action) {
  const b = document.createElement("button");
  b.type = "button"; b.className = cls; b.textContent = label;
  b.addEventListener("click", async () => {
    if (action === "reissue" && !confirm("Their current login stops working. Make a new one?")) return;
    if (action === "remove" && !confirm("Remove this request from the list? It cannot be undone.")) return;
    b.disabled = true;
    const r = await fetch("/api/admin/requests/" + encodeURIComponent(id) + "/" + action,
                          {method: "POST", headers: headers()});
    if (!r.ok) $("msg").textContent = "That did not go through (" + r.status + ").";
    else if (action === "reissue") showLink((await r.json()).token);
    load();
  });
  return b;
}
load();
</script>
</body>
</html>
